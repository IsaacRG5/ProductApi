spring.application.name=ProductApi

# --- Datasource (matches docker-compose.yaml) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/ProductoApi
spring.datasource.username=isaacProducto
spring.datasource.password=ApiProducto
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Server ---
server.port=8080